<div class="upload-container">
  <h2>Uploader une facture</h2>

  <div
    class="dropzone"
    [class.dragging]="isDragging()"
    (dragover)="onDragOver($event)"
    (dragleave)="onDragLeave($event)"
    (drop)="onDrop($event)"
  >
    <p *ngIf="!selectedFile()">Glisse-dépose un fichier ici, ou</p>
    <p *ngIf="selectedFile()">Fichier sélectionné : <strong>{{ selectedFile()!.name }}</strong></p>

    <label class="file-label">
      Choisir un fichier
      <input type="file" (change)="onFileSelected($event)" accept=".pdf,.png,.jpg,.jpeg" hidden>
    </label>
  </div>

  <button
    (click)="onSubmit()"
    [disabled]="!selectedFile() || uploading()"
  >
    {{ uploading() ? 'Envoi en cours...' : 'Envoyer' }}
  </button>

  <p *ngIf="successMessage()" class="success">{{ successMessage() }}</p>
  <p *ngIf="errorMessage()" class="error">{{ errorMessage() }}</p>
</div>
